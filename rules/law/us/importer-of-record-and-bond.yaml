id: law/us/importer-of-record-and-bond
kind: law
jurisdiction: us
platform: null
marketplace: null
topic: customs
applies_to: all
summary:
  en: >-
    Every US import has an importer of record (IOR), the party legally responsible for entering the goods, classifying
    and valuing them with reasonable care, and paying duties. Shipments valued at $2,500 or less may generally use
    informal entry; formal entries need a customs bond on CBP Form 301 before the goods are released (19 CFR 142.4).
    A bond is either single-transaction (generally at least the entered value plus duties, taxes and fees) or continuous
    (at least $50,000, or 10% of the duties, taxes and fees of the previous 12 months if higher). CBP proposed on
    2026-10-08 to also require bonds for certain informal entries; that proposal is not final.
  zh: >-
    每一票美国进口都有一个进口记录人（importer of record，IOR），即在法律上负责报关、以合理谨慎进行归类和估价并缴纳关税的一方。
    价值不超过 2,500 美元的货物一般可走非正式报关；正式报关则须在放行前提交 CBP 301 表格的海关保证金（bond）
    （19 CFR 142.4）。保证金分为单次保证金（一般不低于申报价值加关税、税费）和年度连续保证金（至少 50,000 美元，
    或上一 12 个月关税、税费总额的 10%，取较高者）。CBP 于 2026-10-08 提议对部分非正式报关也要求保证金，该提案尚未生效。

id: law/us/uspto-trademark
kind: law
jurisdiction: us
platform: null
marketplace: null
topic: ip
applies_to: all
summary:
  en: >-
    US trademarks are registered with the United States Patent and Trademark Office (USPTO). Since 2019-08-03,
    applicants and registrants whose domicile is outside the US must be represented by a US-licensed attorney. Since
    2025-01-18 the electronic base application fee is $350 per class of goods or services, with possible surcharges
    per class: $100 for insufficient information, $200 for describing goods in free-form text instead of using the ID
    Manual, and $200 for each additional 1,000 characters of free-form text. Keeping a registration in force later
    requires further filings and fees.
  zh: >-
    美国商标在美国专利商标局（USPTO）注册。自 2019-08-03 起，住所地在美国境外的申请人和注册人必须由持有美国执照的律师代理。
    自 2025-01-18 起，电子提交的基础申请费为每个商品或服务类别 350 美元，并可能按类别加收附加费：信息不足 100 美元；
    不使用 ID Manual 而以自由文本描述商品 200 美元；自由文本每超出 1,000 个字符再加 200 美元。注册后维持商标有效还需要后续文件和费用。
effective_date: 2025-01-18

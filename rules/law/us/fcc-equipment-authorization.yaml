topic: product-safety
applies_to: [electronics, radio-frequency devices]
summary:
  en: >-
    Under FCC rules (47 CFR part 2), a radio-frequency device may not be marketed in the US until it has the required
    equipment authorization or otherwise meets the applicable technical, labelling and identification requirements.
    "Marketing" includes selling, offering, advertising and importing for sale. There are two authorization procedures:
    Certification, granted by a Telecommunication Certification Body, and the Supplier's Declaration of Conformity
    (SDoC); the FCC rule part for each type of device says which one applies.
  zh: >-
    根据美国联邦通信委员会（FCC）规则（47 CFR 第 2 部分），射频设备在取得所需的设备授权、或以其他方式满足适用的技术、
    标签和标识要求之前，不得在美国上市销售。这里的“上市销售”包括销售、报价、广告以及为销售目的而进口。
    设备授权有两种程序：由电信认证机构（TCB）颁发的认证（Certification），以及供应商符合性声明（SDoC）；
    具体适用哪一种，由该类设备所属的 FCC 规则部分决定。

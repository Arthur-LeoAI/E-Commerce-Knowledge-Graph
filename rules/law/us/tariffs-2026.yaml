id: law/us/tariffs-2026
kind: law
jurisdiction: us
platform: null
marketplace: null
topic: tariff
applies_to: all
summary:
  en: >-
    On 2026-02-20 the US Supreme Court decided (Learning Resources v. Trump) that the IEEPA emergency law does not
    allow the President to impose tariffs, so the IEEPA tariffs ended. A temporary 10% import surcharge under Section 122
    of the Trade Act replaced them from 2026-02-24 and expired on 2026-07-24 after its 150-day limit. Since 2026-07-24,
    new Section 301 tariffs of 10% or 12.5% apply to goods from 60 economies (China: 12.5%), with listed exemptions;
    goods covered by Section 232 tariffs are excluded from them. Section 232 tariffs (for example steel, aluminium,
    copper, autos and parts, timber, semiconductors, pharmaceuticals) stay in force, and other country-specific actions
    also exist, so check the current rate for your product and origin before each order.
  zh: >-
    2026-02-20，美国最高法院在 Learning Resources v. Trump 案中裁定，IEEPA（国际紧急经济权力法）不授权总统征收关税，
    IEEPA 关税因此终止。随后依据《贸易法》第 122 条加征的 10% 临时进口附加税自 2026-02-24 起实施，
    并在 150 天期限届满后于 2026-07-24 失效。自 2026-07-24 起，新的第 301 条关税对来自 60 个经济体的商品征收 10% 或 12.5%
    （中国为 12.5%），并有列明的豁免；已适用第 232 条关税的商品不再叠加。第 232 条关税（如钢、铝、铜、汽车及零部件、
    木材、半导体、药品等）继续有效，另有针对个别国家的措施，因此每次下单前都应核对自己产品和原产地的现行税率。
effective_date: 2026-07-24

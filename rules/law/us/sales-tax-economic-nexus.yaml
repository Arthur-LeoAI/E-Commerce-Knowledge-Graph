id: law/us/sales-tax-economic-nexus
kind: law
jurisdiction: us
platform: null
marketplace: null
topic: sales-tax
applies_to: all
summary:
  en: >-
    The US federal government does not control sales tax. Each state decides whether to levy it and at what rate, and
    cities and counties often add their own; Alaska, Delaware, Montana, New Hampshire and Oregon have no statewide
    sales tax. On 2018-06-21 the Supreme Court decided South Dakota v. Wayfair and dropped the old rule that a seller
    needed a physical presence in a state before that state could make it collect sales tax. States may now use
    "economic nexus": a duty to collect once a remote seller's sales into the state pass a threshold set by that state
    (South Dakota's law used more than $100,000 of sales or 200 or more transactions a year; other states set their
    own thresholds).
  zh: >-
    美国的销售税不由联邦政府管理。是否征收销售税、税率多少，由各州自行决定，市和县往往还会另加地方税；阿拉斯加、特拉华、蒙大拿、
    新罕布什尔和俄勒冈五个州没有州级销售税。2018-06-21，美国最高法院在 South Dakota v. Wayfair 案中废除了旧规则：
    过去卖家必须在某州有实体存在，该州才能要求其代收销售税。如今各州可以采用“经济关联”（economic nexus）标准：
    远程卖家向该州的销售额超过该州设定的门槛后，就需要代收销售税（南达科他州法律的门槛是每年销售额超过 100,000 美元，
    或交易笔数达到 200 笔及以上；其他州各自设定门槛）。
effective_date: 2018-06-21

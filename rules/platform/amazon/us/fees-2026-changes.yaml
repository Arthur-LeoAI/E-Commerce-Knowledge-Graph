summary:
  en: >-
    Amazon's 2026 update to US selling fees took effect on 15 January 2026. Amazon says FBA fees
    rose by about $0.08 per unit sold on average; the published summary lists changes to FBA
    fulfilment, inbound placement, aged-inventory and some other fees, but no change to referral
    fee rates. Since 17 April 2026 Amazon has added a 3.5% fuel and logistics surcharge on top of
    US FBA fulfilment fees, which it calls temporary, with no end date given. Higher holiday-peak
    fulfilment fees apply from 15 October 2026 to 14 January 2027.
  zh: >-
    亚马逊 2026 年美国站费用调整自 2026 年 1 月 15 日起生效。亚马逊表示，FBA 费用平均每售出一件上涨约
    0.08 美元；官方摘要列出了 FBA 配送费、入库配置费、超龄库存费等调整，但没有调整销售佣金费率。自
    2026 年 4 月 17 日起，亚马逊在美国 FBA 配送费之外另加收 3.5% 的燃油和物流附加费，称其为临时措施，
    但未给出结束日期。2026 年 10 月 15 日至 2027 年 1 月 14 日适用更高的假日旺季配送费。
effective_date: 2026-01-15

name: Check rules due for review

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Open or update one Issue listing rules past next_review
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Rules past their review date"
          LABEL: rule-review
        run: |
          count=$(node scripts/check-stale.mjs --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).due.length))')
          echo "Rules due: $count"
          [ "$count" -gt 0 ] || exit 0
          node scripts/check-stale.mjs > report.md
          gh label create "$LABEL" --color FBCA04 --description "A rule needs re-checking against its sources" 2>/dev/null || true
          existing=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file report.md
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body-file report.md
          fi

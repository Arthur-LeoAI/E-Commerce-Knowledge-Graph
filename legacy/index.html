<title>电商运营全景图谱</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: value-chain atlas — domain panels in reading order, live relation overlay, detail rail on the right */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --sunk:#e9ebf0; --fg:#18202d; --muted:#5a6476; --line:#d8dce4;
  --ink:#18202d; --focus:#2457d6;
  --l1:#d9480f; --l2:#e8870f; --l3:#b8a106; --up1:#1d63d6; --up2:#4c8ae8; --up3:#7aa9ee;
  --dS:#5b4bb7; --dP:#2f7d5b; --dC:#b23a48; --dL:#b5651d; --dF:#1f6fb2; --dM:#a8327f; --dX:#7d6e0c; --dF2:#0f7c86; --dD:#5a6472;
  --display:"Noto Serif SC","Songti SC","SimSun",serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f131a; --surface:#171c25; --sunk:#1e2430; --fg:#e5e8ee; --muted:#9aa3b3; --line:#2b3240; --ink:#e5e8ee; --focus:#7aa2ff;
  --l1:#ff7a45; --l2:#ffab4a; --l3:#e2cf4f; --up1:#6aa1ff; --up2:#8fb7ff; --up3:#b3ceff;
  --dS:#a99df2; --dP:#6fcfa1; --dC:#f08a96; --dL:#f0a65e; --dF:#6fb3f0; --dM:#ec86c8; --dX:#ddc957; --dF2:#5fd0d9; --dD:#a9b4c2;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f131a; --surface:#171c25; --sunk:#1e2430; --fg:#e5e8ee; --muted:#9aa3b3; --line:#2b3240; --ink:#e5e8ee; --focus:#7aa2ff;
  --l1:#ff7a45; --l2:#ffab4a; --l3:#e2cf4f; --up1:#6aa1ff; --up2:#8fb7ff; --up3:#b3ceff;
  --dS:#a99df2; --dP:#6fcfa1; --dC:#f08a96; --dL:#f0a65e; --dF:#6fb3f0; --dM:#ec86c8; --dX:#ddc957; --dF2:#5fd0d9; --dD:#a9b4c2;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1360px;margin:0 auto}
header.top{padding-block:28px 8px;display:flex;flex-wrap:wrap;gap:12px 32px;align-items:flex-end;justify-content:space-between}
h1{font-family:var(--display);font-weight:900;font-size:clamp(26px,4vw,38px);line-height:1.15;margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;max-width:62ch}
.formula{font-family:var(--mono);font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:8px 12px;background:var(--surface);max-width:100%;overflow-x:auto;white-space:nowrap}
.formula b{color:var(--fg);font-weight:500}
.hright{display:contents}
header.top{position:relative}
.langbtn{font-weight:700;position:absolute;top:24px;right:0}
header.top > div:first-child{padding-right:64px}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:18px;overflow-x:auto}
nav.tabs a{padding:10px 14px;color:var(--muted);text-decoration:none;white-space:nowrap;border-bottom:2px solid transparent;font-weight:500}
nav.tabs a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--fg)}
nav.tabs a:focus-visible,button:focus-visible,.chip:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
section.view{padding-top:20px}
/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--muted);padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.search{flex:1 1 200px;max-width:280px;position:relative}
.search input{width:100%;font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
/* map */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start}
@media (max-width:1040px){.layout{grid-template-columns:minmax(0,1fr)}}
.map{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.map svg.overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:visible}
.domain{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 12px 14px;position:relative}
.domain h3{margin:0 0 2px;font-family:var(--display);font-weight:600;font-size:16px;display:flex;gap:8px;align-items:baseline}
.domain h3 .code{font-family:var(--mono);font-size:11px;color:var(--dc);letter-spacing:.08em}
.domain p.dd{margin:0 0 10px;font-size:12.5px;color:var(--muted);line-height:1.5}
.domain::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--dc)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative;z-index:3;font:inherit;font-size:13.5px;line-height:1.3;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--sunk);color:var(--fg);cursor:pointer;text-align:left;transition:opacity .15s,border-color .15s,background .15s}
.chip:hover{border-color:var(--dc)}
.chip .ord{font-family:var(--mono);font-size:10.5px;margin-left:6px;color:var(--muted)}
.map.has-sel .chip.dim{opacity:.32}
.chip.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.sel .ord{color:var(--bg)}
.chip.lv1{border-color:var(--c1);box-shadow:inset 0 0 0 1.5px var(--c1)}
.chip.lv2{border-color:var(--c2);box-shadow:inset 0 0 0 1px var(--c2)}
.chip.lv3{border-color:var(--c3);border-style:dashed}
.chip.src::after{content:attr(data-st);font-size:10px;color:var(--muted);margin-left:6px}
.map[data-mode="down"]{--c1:var(--l1);--c2:var(--l2);--c3:var(--l3)}
.map[data-mode="up"]{--c1:var(--up1);--c2:var(--up2);--c3:var(--up3)}
path.e{fill:none;stroke-width:1.6;opacity:.9}
path.e.l1{stroke:var(--c1);stroke-width:2.2} path.e.l2{stroke:var(--c2)} path.e.l3{stroke:var(--c3);stroke-dasharray:4 4}
marker path.m1{fill:var(--c1)} marker path.m2{fill:var(--c2)} marker path.m3{fill:var(--c3)}
/* detail */
aside.detail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);max-height:calc(100vh - 72px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 18px 22px;min-width:0}
@media (max-width:1040px){aside.detail{position:static;max-height:none}}
.empty h2{font-family:var(--display);font-size:20px;margin:0 0 8px}
.empty ol{padding-left:20px;margin:8px 0;color:var(--muted)}
.dtag{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--dc);text-transform:uppercase}
.detail h2{font-family:var(--display);font-weight:900;font-size:24px;margin:2px 0 4px;line-height:1.25}
.detail h4{font-size:12px;letter-spacing:.12em;color:var(--muted);margin:18px 0 6px;font-weight:700}
.detail p{margin:0}
.detail ol,.detail ul{margin:0;padding-left:20px}
.detail li{margin:2px 0}
.metrics{display:flex;flex-wrap:wrap;gap:6px}
.metrics span{font-size:12.5px;padding:2px 8px;border-radius:4px;background:var(--sunk);border:1px solid var(--line)}
.us{border:1px solid var(--line);border-left:3px solid var(--dC);border-radius:6px;padding:10px 12px;background:var(--sunk);font-size:14px}
.us .asof{font-family:var(--mono);font-size:11px;color:var(--muted);display:block;margin-bottom:4px}
.ref{font-family:var(--mono);font-size:11px;color:var(--focus);text-decoration:none;margin-left:2px}
.datab{font-size:14px;color:var(--fg)}
.chain .lvl{margin-top:10px}
.chain .lvl b{font-family:var(--mono);font-size:11.5px;font-weight:500;display:inline-block;padding:1px 7px;border-radius:4px;color:var(--bg)}
.chain .lvl.k1 b{background:var(--c1)} .chain .lvl.k2 b{background:var(--c2)} .chain .lvl.k3 b{background:var(--c3)}
.chain ul{list-style:none;padding:0;margin:6px 0 0}
.chain li{padding:5px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.chain li button{font:inherit;background:none;border:0;padding:0;color:var(--fg);font-weight:700;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.chain li .via{color:var(--muted)}
.detail[data-mode="down"]{--c1:var(--l1);--c2:var(--l2);--c3:var(--l3)}
.detail[data-mode="up"]{--c1:var(--up1);--c2:var(--up2);--c3:var(--up3)}
.btnrow{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.ghost{font:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--muted);padding:5px 10px;border-radius:6px;cursor:pointer}
/* prose views */
.prose{max-width:860px}
.prose h2{font-family:var(--display);font-weight:900;font-size:26px;margin:4px 0 6px}
.prose > p.lead{color:var(--muted);margin:0 0 18px;max-width:66ch}
.phase{display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 16px;padding:18px 0;border-top:1px solid var(--line)}
.phase .n{font-family:var(--display);font-weight:900;font-size:34px;line-height:1;color:var(--muted)}
.phase h3{margin:0;font-size:18px}
.phase .out{font-size:14px;margin:6px 0 0}
.phase .warn{font-size:13.5px;color:var(--muted);margin:4px 0 0}
.phase .links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.phase .links .chip{font-size:12.5px;padding:4px 9px}
@media (max-width:520px){.phase{grid-template-columns:minmax(0,1fr)}}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:12px 0 20px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700;background:var(--sunk)}
tr:last-child td{border-bottom:0}
.stage{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:12px 0 22px}
.stage div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px}
.stage .k{font-family:var(--mono);font-size:11px;color:var(--muted)}
.stage h4{margin:2px 0 4px;font-size:15px}
.stage p{margin:0;font-size:13.5px;color:var(--muted)}
.srcs li{margin:8px 0}
.srcs a{color:var(--focus)}
.note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:24px}
.uslist{display:grid;gap:12px}
.uslist .item{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.uslist .item h3{margin:0 0 4px;font-size:16px}
.hv{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px 18px;min-height:420px}
.crumbs{display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center;font-size:14px}
.crumbs button{font:inherit;background:none;border:0;color:var(--focus);cursor:pointer;padding:2px 4px;border-radius:4px}
.crumbs .cur{font-weight:700;color:var(--fg);padding:2px 4px}
.crumbs .sep{color:var(--muted)}
.crumbs .lv{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto;padding-left:12px}
.hvsub{font-size:13px;color:var(--muted);margin:2px 4px 8px;max-width:70ch}
svg.hsvg{display:block;width:100%;height:auto;overflow:visible}
.hsvg text{font-family:var(--body);fill:var(--fg)}
.hsvg text.mu{fill:var(--muted)}
.hsvg text.mono{font-family:var(--mono);fill:var(--muted)}
.hsvg .box{fill:var(--sunk);stroke:var(--line);stroke-width:1}
.hsvg .box.port{fill:var(--surface);stroke-dasharray:4 3}
.hsvg .box.center{fill:var(--ink);stroke:var(--ink)}
.hsvg text.oncenter{fill:var(--bg)}
.hsvg g.clk{cursor:pointer}
.hsvg g.clk:hover .box{stroke:var(--fg)}
.hsvg g.clk:focus{outline:none}
.hsvg g.clk:focus-visible .box{stroke:var(--focus);stroke-width:2}
.hsvg .e{fill:none;stroke-width:1.6;transition:opacity .15s}
.hsvg .e.ext{stroke-width:1.2;opacity:.55}
.hsvg .e.bk{stroke-dasharray:5 4}
.hsvg.v .e.ext{opacity:.2}
.hsvg.hl .e{opacity:.08}
.hsvg.hl .e.on{opacity:1;stroke-width:2.2}
.hsvg.hl g.n{opacity:.35}
.hsvg.hl g.n.on{opacity:1}
.hsvg .elab{font-size:11.5px;fill:var(--muted)}
.hsteps{list-style:none;padding:0;margin:16px 0 0;display:flex;flex-wrap:wrap;gap:10px 28px;counter-reset:s}
.hsteps li{position:relative;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px 8px 32px;font-size:13.5px;line-height:1.5;flex:1 1 170px;max-width:250px;counter-increment:s}
.hsteps li::before{content:counter(s);position:absolute;left:10px;top:8px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.hsteps li:not(:last-child)::after{content:"→";position:absolute;right:-21px;top:50%;transform:translateY(-50%);color:var(--muted)}
.hsteps-h{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700;margin:18px 4px 0}
@media (max-width:640px){.hsteps{flex-direction:column;gap:22px}.hsteps li{max-width:none;flex:none}.hsteps li:not(:last-child)::after{content:"↓";right:auto;left:50%;top:auto;bottom:-20px;transform:none}}
.dlist{list-style:none;padding:0;margin:4px 0 0}
.dlist li{font-size:13.5px;padding:4px 0;border-bottom:1px dashed var(--line)}
.dlist li b{font-weight:700}
.dlist .mu{color:var(--muted)}
.linkbtn{font:inherit;background:none;border:0;padding:0;color:var(--fg);font-weight:700;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.map3d{position:relative;height:min(68vh,660px);min-height:400px;background:var(--bg);border:1px solid var(--line);border-radius:8px;margin-top:4px;overflow:hidden;touch-action:none}
.map3d canvas{display:block;width:100%;height:100%;cursor:grab}
.map3d canvas.drag{cursor:grabbing}
.map3d canvas.hov{cursor:pointer}
.m3ctrl{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.m3ctrl .ghost{background:var(--surface)}
.m3ctrl .ghost[aria-pressed="true"]{color:var(--fg);border-color:var(--fg)}
.m3legend{position:absolute;left:12px;top:10px;display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);pointer-events:none;background:color-mix(in srgb,var(--surface) 80%,transparent);padding:6px 8px;border-radius:6px}
.m3legend span{display:flex;align-items:center;gap:6px}
.m3legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.m3legend .fb i{width:16px;height:0;border-radius:0;border-top:1.5px dashed var(--muted)}
.m3hint{position:absolute;left:12px;right:12px;bottom:8px;margin:0;font-size:12px;color:var(--muted);pointer-events:none}
@media (max-width:640px){.m3legend{display:none}.map3d{height:72vh}.m3hint .flow{display:none}}
/* advanced menu */
.toolbar{position:relative}
details.adv{position:relative}
details.adv summary{list-style:none;cursor:pointer;font-size:14px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--muted);user-select:none}
details.adv summary::-webkit-details-marker{display:none}
details.adv summary::after{content:" ▾"}
details.adv[open] summary{color:var(--fg);border-color:var(--fg)}
.advbody{position:absolute;right:0;top:calc(100% + 6px);z-index:8;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;width:max-content;max-width:min(560px,calc(100vw - 32px));box-shadow:0 8px 28px rgba(0,0,0,.12)}
.advrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.advlab{font-size:12px;color:var(--muted);min-width:32px}
.advnote{margin:0;font-size:12.5px;color:var(--muted);max-width:52ch}
@media (max-width:640px){.advbody{position:fixed;left:16px;right:16px;top:auto;width:auto}}
/* glossary */
.term{border-bottom:1px dotted currentColor;cursor:help}
.term:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
#tip{position:fixed;z-index:20;max-width:260px;background:var(--ink);color:var(--bg);font-size:13px;line-height:1.5;padding:8px 10px;border-radius:6px;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#tip b{display:block;font-family:var(--mono);font-size:11.5px;opacity:.8;margin-bottom:2px}
/* example box */
.exbox{border:1px solid var(--line);border-radius:8px;background:var(--sunk);padding:10px 12px;font-size:14px}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--dL);border:1px solid var(--dL);border-radius:4px;padding:0 6px;margin-right:6px;vertical-align:1px}
details.more{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
details.more > summary{cursor:pointer;font-size:14px;color:var(--focus);list-style:none}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary::before{content:"＋ "}
details.more[open] > summary::before{content:"－ "}
/* tour */
#v-tour{max-width:820px;margin:0 auto}
.tnote{font-size:13px;color:var(--muted);margin:0 0 14px}
.tsteps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tsteps button{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:3px 10px;cursor:pointer}
.tsteps button.done{color:var(--fg)}
.tsteps button[aria-current="step"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:26px clamp(18px,4vw,36px) 24px;position:relative;overflow:hidden}
.tcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--dc)}
.tnum{font-family:var(--mono);font-size:12px;color:var(--dc);letter-spacing:.08em}
.tcard h2{font-family:var(--display);font-weight:900;font-size:clamp(26px,4vw,34px);margin:4px 0 10px;line-height:1.2}
.tone{font-size:clamp(17px,2.2vw,20px);line-height:1.6;margin:0 0 18px;max-width:40ch}
.tex{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:15px}
.tex ul{margin:6px 0 0;padding-left:20px}
.tex li{margin:4px 0}
.tex p{margin:6px 0}
.tex .head{font-size:12.5px;color:var(--muted)}
.tcmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.tcmp div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:2px}
.tcmp .k{font-size:12px;color:var(--muted)}
.tcmp span{font-size:14px}
em.neg{font-style:normal;font-weight:700;color:var(--dC)}
em.pos{font-style:normal;font-weight:700;color:var(--dP)}
.tnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.tnav .primary{font:inherit;font-weight:700;font-size:15px;background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:10px 20px;cursor:pointer}
.tnav .link{font:inherit;font-size:14px;background:none;border:0;color:var(--focus);cursor:pointer;padding:6px 0;margin-right:16px}

<script>
const AS_OF = "2026-10-30";
const DOMAINS = [
 {k:"S",code:"01 STRATEGY",name:"战略与市场",c:"--dS",desc:"做什么、卖给谁、在哪里卖"},
 {k:"P",code:"02 PRODUCT",name:"产品与供应链",c:"--dP",desc:"把想法变成稳定供应的合格产品"},
 {k:"C",code:"03 COMPLIANCE",name:"合规与关务",c:"--dC",desc:"能不能合法进口、合法销售"},
 {k:"L",code:"04 LOGISTICS",name:"物流与仓储",c:"--dL",desc:"货从工厂到用户手里的全过程"},
 {k:"F",code:"05 STOREFRONT",name:"渠道与店铺",c:"--dF",desc:"在哪个平台、以什么页面面对用户"},
 {k:"M",code:"06 MARKETING",name:"营销与流量",c:"--dM",desc:"让用户找到你、相信你"},
 {k:"X",code:"07 SALES",name:"销售与客户",c:"--dX",desc:"流量变成订单，订单变成口碑"},
 {k:"$",code:"08 FINANCE",name:"财务与利润",c:"--dF2",desc:"每一件赚多少，钱什么时候回来"},
 {k:"D",code:"09 DATA & TEAM",name:"数据与组织",c:"--dD",desc:"让整个体系可以被衡量和管理"}
];
const NODES = [
 {id:"market",d:"S",n:"市场调研",en:"Market research",what:"判断一个市场值不值得进入：需求有多大、增长如何、竞争多激烈、利润空间够不够。",how:["用平台搜索量和类目榜单估算需求规模与季节性","分析头部卖家的价格带、评论数和评分","看趋势：搜索趋势、社交媒体话题","估算进入成本：认证、首批库存、广告投入","给出结论：做、不做，或者怎样差异化"],m:["搜索量","类目规模","头部集中度","平均售价","评论门槛"],data:"来源：Amazon Brand Analytics（需品牌备案）、第三方选品工具、Google Trends。方法：描述统计、季节性分解。"},
 {id:"competitors",d:"S",n:"竞争对手",en:"Competitors",what:"和你争同一批用户和关键词的卖家与品牌。它们的价格、广告和产品迭代会直接影响你。",how:["列出核心竞品的商品和品牌","定期记录价格、排名、评论数、促销","拆解竞品差评，找到改进点","查看它们在投放哪些关键词"],m:["竞品价格","竞品排名","评分","评论增速","广告位占有"],data:"来源：Keepa 等价格和排名历史数据。方法：时间序列对比、市场份额估算。"},
 {id:"selection",d:"S",n:"选品",en:"Product selection",what:"决定卖什么具体产品。合规、物流、竞争和利润的难度，大多在这一步就被定下来了。",how:["用市场调研筛出候选品","每个候选品先做单件利润测算（落地成本、平台费、广告）","检查合规门槛：认证要求、受限类目","检查物流属性：尺寸、重量、易碎、带电","小批量测款，验证后再加单"],m:["预估毛利率","预估回本周期","合规难度","尺寸分段"],data:"方法：加权打分卡、盈亏平衡分析。"},
 {id:"positioning",d:"S",n:"定位与定价策略",en:"Positioning",what:"你为谁解决什么问题，以什么价格段出现。定位决定品牌调性、文案、广告关键词和目标价格。",how:["明确目标用户和使用场景","找到和竞品不同的卖点","选择价格带：低价走量、中端性价比或高端品牌","写成一句话定位，用来指导所有内容"],m:["目标价格带","目标毛利率","差异化卖点"],data:"方法：价格分布分析、评论文本分析（找用户痛点）。"},
 {id:"model",d:"S",n:"商业模式与渠道策略",en:"Business model",what:"决定在哪里卖、怎么卖：只做 Amazon、只做独立站，还是多平台；用平台仓还是自发货。",how:["评估各渠道的流量、费用、规则和回款周期","起步通常集中在一个主渠道","主渠道稳定后再扩展","选择履约模式：平台仓、第三方仓或自发货"],m:["渠道收入占比","渠道利润率","单一渠道依赖度"],data:"方法：分渠道利润对比、集中度风险评估。"},

 {id:"dev",d:"P",n:"产品开发",en:"Product development",what:"把选品想法变成可以量产的产品：规格、材料、外观、功能和成本。",how:["写产品需求文档","打样并测试","根据竞品差评做改进","同步确认合规要求和包装尺寸","定稿后冻结规格"],m:["打样周期","单件目标成本","缺陷率目标"],data:"来源：评论文本、退货原因。方法：文本聚类找痛点。"},
 {id:"sourcing",d:"P",n:"供应商与采购",en:"Sourcing",what:"找到能稳定供货的工厂，谈价格、起订量（MOQ）、交期和付款条件。",how:["多家比价并验厂","谈定 MOQ、单价、交期和付款方式（常见为定金加尾款）","签采购合同，写明质量标准","建立备选供应商"],m:["采购单价","MOQ","生产交期","准时交货率"],data:"来源：ERP 采购单。方法：交期分布统计、供应商评分。"},
 {id:"qc",d:"P",n:"质量控制",en:"Quality control",what:"在出货前发现问题，避免把次品卖给用户。质量问题最终会变成退货、差评和账户风险。",how:["定义验货标准（如 AQL 抽样）","做产前、产中和出货前检验","记录缺陷类型并反馈给工厂"],m:["验货不合格率","质量原因退货占比"],data:"来源：验货报告、退货原因代码。方法：帕累托分析，找出最主要的几类缺陷。"},
 {id:"packaging",d:"P",n:"包装与标签",en:"Packaging",what:"包装决定产品的尺寸和重量，直接影响运费和平台配送费档位，也承载合规标签和品牌体验。",how:["尽量缩小体积和重量","通过跌落测试","印上合规标识：原产地、警示语、条码","贴平台要求的标签（如 Amazon 的 FNSKU）"],m:["包装尺寸","计费重量","破损率"],data:"方法：按尺寸分段对比，算出每缩小一档能省多少费用。"},
 {id:"brand_ip",d:"P",n:"品牌与知识产权",en:"Brand & IP",what:"注册商标、保护外观和专利，同时避免侵犯别人的权利。品牌是长期资产，也是很多平台功能的入口。",how:["在目标国家注册商标","申请平台品牌备案","上架前做侵权排查：商标、外观设计、专利","监控跟卖和仿冒"],m:["商标状态","侵权投诉数","跟卖次数"],us:"美国商标在 USPTO 申请。Amazon 品牌备案（Brand Registry）需要已注册或已申请的商标，备案后才能使用 A+ 内容、品牌旗舰店和 Brand Analytics 等功能。",data:"来源：投诉和跟卖记录。方法：频次统计。"},

 {id:"entity",d:"C",n:"公司主体与税务登记",en:"Legal entity",what:"以什么法律主体经营、在哪里报税。主体决定能开哪些账户、要承担哪些税务义务。",how:["选择经营主体：本地公司或海外公司","办理税号","开设可以收款的银行或支付账户","完成平台身份验证"],m:["主体资质","年度申报节点"],us:"外国公司可以直接在 Amazon.com 开店。非美国主体涉及美国税务表格时，通常提交 W-8BEN-E。主体和税务结构请咨询专业会计师或律师。",data:"非数据节点，用台账管理即可。"},
 {id:"product_compliance",d:"C",n:"产品合规认证",en:"Product compliance",what:"产品必须符合目标市场的安全、电气、化学等法规，否则无法进口，或者会被平台下架。",how:["按品类确认适用法规","找认可实验室检测","准备合格证书和技术文件","在平台上传合规文件","法规更新时复核"],m:["证书有效期","检测费用","被要求补件次数"],us:"一般消费品需要 GCC（通用合格证书），儿童产品需要由 CPSC 认可的第三方实验室检测并出具 CPC。自 2026-07-08 起，CPSC 监管的产品进口时需在 CBP 的 ACE 系统里电子申报证书数据（eFiling）。电子产品常涉及 FCC；食品、化妆品、医疗器械归 FDA 监管；加州 Proposition 65 要求对特定化学物质做警示。",src:[7],data:"来源：证书台账。方法：到期提醒。"},
 {id:"customs",d:"C",n:"进口清关",en:"Customs clearance",what:"货物进入目的国时向海关申报商品编码、价值和原产地，并缴纳关税和费用。",how:["确定进口商（Importer of Record）","委托报关行","正确归类商品编码（HS / HTS）","海运货物提前申报","缴税放行"],m:["清关时长","查验率","申报差错数"],us:"美国进口需要 IOR 和海关保证金（customs bond），海运货物需在装船前提交 ISF（10+2）申报。800 美元以下包裹免税的 de minimis 待遇自 2025 年 8 月起暂停；CBP 自 2026-06-24 起对所有运输方式无限期暂停，法律层面该豁免将于 2027-07-01 终止。邮政小包新的非正式报关流程，合规日期已推迟到 2027-01-20。",src:[4,5,6],data:"来源：报关单（Entry Summary）。方法：清关时效统计。"},
 {id:"tariff",d:"C",n:"关税",en:"Tariffs",what:"进口时按商品编码和原产地征收的税，直接计入落地成本。",how:["查准商品编码对应的基础税率","叠加适用的附加关税","计入落地成本","跟踪政策变化，评估原产地多元化"],m:["有效关税率","单件关税成本"],us:"基础税率按 HTSUS 10 位编码确定。2026-02-20 美国最高法院裁定 IEEPA 关税无效；随后的 Section 122 临时附加税于 2026-07-24 到期，由对约 60 个经济体征收 10% 或 12.5% 的新 Section 301 关税接替；钢、铝、汽车等仍有 Section 232 关税。关税政策变化频繁，下单前应在官方 HTS 和 CBP 查询最新税率。",src:[1,2,3],data:"来源：报关单、HTS 税率表。方法：情景对比（不同税率下的单件利润）。"},
 {id:"sales_tax",d:"C",n:"销售税与间接税",en:"Sales tax / VAT",what:"卖给消费者时要代收的税。美国按州征收销售税，欧盟等地区征收增值税（VAT）。",how:["判断在哪些地区有纳税义务","区分平台代收和自己申报的部分","在独立站配置税费计算","按期申报"],m:["有纳税义务的地区数","申报准确率"],us:"美国没有联邦增值税，由各州征收销售税。2018 年 South Dakota v. Wayfair 案后，各州可以按销售额或订单数认定远程卖家的纳税义务（economic nexus）。征收销售税的州都有 marketplace facilitator 法规，由 Amazon 等平台代收代缴；独立站需要卖家自己追踪和申报。",data:"来源：订单的收货州、税务软件。方法：各州销售额阈值监控。"},
 {id:"platform_policy",d:"C",n:"平台政策",en:"Platform policy",what:"平台自己的规则：类目审核、商品政策、费用调整、卖家身份验证等。违反会导致下架或封号。",how:["定期阅读平台公告","上架前检查类目是否受限","记录费用调整，并更新成本模型"],m:["政策变化次数","受影响 SKU 数"],us:"根据 INFORM Consumers Act（2023-06-27 生效），平台必须核验高销量卖家的身份和银行信息。Amazon 美国站自 2026-01-01 起停止 FBA 预处理和贴标服务，2026 年费用调整自 2026-01-15 生效。",src:[8,9,10],data:"来源：平台公告。方法：变更日志。"},

 {id:"firstmile",d:"L",n:"头程物流",en:"First-mile freight",what:"把货从工厂运到目的国仓库：海运、空运、快递，以及中间的订舱、拖车和清关衔接。",how:["按时效和成本选择运输方式","订舱并安排装柜","衔接报关和清关","送到平台仓或第三方仓"],m:["单件头程成本","运输时效","时效波动"],data:"来源：货代账单、物流轨迹。方法：时效分布统计（看波动，不只看平均值）。"},
 {id:"warehouse",d:"L",n:"仓储",en:"Warehousing (FBA / 3PL)",what:"货物在目的国存放的地方：平台仓（如 FBA）或第三方海外仓（3PL）。",how:["选择仓储模式","按要求备货入库","管理库龄","及时清理滞销库存"],m:["库容使用率","库龄","仓储费","入库时长"],data:"来源：库存报表。方法：库龄分布、仓储费归因。"},
 {id:"inventory_plan",d:"L",n:"库存计划与补货",en:"Inventory planning",what:"决定什么时候补货、补多少。补少了会断货掉排名，补多了占资金还产生仓储费。",how:["预测未来日均销量","计算补货周期：生产交期 + 运输时效 + 入库时长","设置安全库存","算出补货点和补货量"],m:["库存周转天数","可售天数","断货率","补货点"],data:"方法：补货点 = 日均销量 × 补货周期 + 安全库存；安全库存根据销量和交期的波动计算。"},

<script>
(function(){
let lang="en"; try{lang=localStorage.getItem("ecomLang")||"en"}catch(e){}
const tx=k=>UI[lang][k];
const tf=(k,o)=>String(tx(k)).replace(/\{(\w+)\}/g,(_,x)=>o[x]);
const ZH={dom:DOMAINS.map(d=>({name:d.name,desc:d.desc})),nodes:Object.fromEntries(NODES.map(n=>[n.id,{n:n.n,what:n.what,how:n.how,m:n.m,us:n.us,data:n.data}])),
  edges:EDGES.map(e=>e[2]),ex:{...EX},tour:TOUR.map(x=>({title:x.title,one:x.one,ex:x.ex})),gloss:{...GLOSS},phases:PHASES.map(x=>({t:x.t,out:x.out,warn:x.warn})),src:SOURCES.map(x=>x.o),tools:TOOLS.map(x=>x.t)};
function applyData(l){
  const E=l==="en";
  DOMAINS.forEach((d,i)=>{const z=E?DOMAINS_EN[d.k]:ZH.dom[i]; d.name=z.name; d.desc=z.desc;});
  NODES.forEach(n=>{const z=E?NODES_EN[n.id]:ZH.nodes[n.id]; n.n=z.n; n.what=z.what; n.how=z.how; n.m=z.m; n.us=z.us; n.data=z.data;});
  EDGES.forEach((e,i)=>{e[2]=E?EDGE_EN_LIST[i]:ZH.edges[i];});
  Object.assign(EX,E?EX_EN:ZH.ex);
  TOUR.forEach((x,i)=>{const z=E?TOUR_EN[i]:ZH.tour[i]; x.title=z.title; x.one=z.one; x.ex=z.ex;});
  Object.keys(GLOSS).forEach(k=>delete GLOSS[k]); Object.assign(GLOSS,E?GLOSS_EN:ZH.gloss);
  PHASES.forEach((x,i)=>{const z=E?PHASES_EN[i]:ZH.phases[i]; x.t=z.t; x.out=z.out; x.warn=z.warn;});
  SOURCES.forEach((x,i)=>{x.o=E?SOURCES_EN_O[i]:ZH.src[i];});
  TOOLS.forEach((x,i)=>{x.t=E?TOOLS_EN[i]:ZH.tools[i];});
}
applyData(lang);
const byId = Object.fromEntries(NODES.map(n=>[n.id,n]));
const dom = Object.fromEntries(DOMAINS.map(d=>[d.k,d]));
const out = {}, inn = {};
NODES.forEach(n=>{out[n.id]=[];inn[n.id]=[]});
EDGES.forEach(([a,b,l])=>{ if(!byId[a]||!byId[b]) console.warn("bad edge",a,b); else {out[a].push({to:b,l});inn[b].push({to:a,l});}});
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let GRE, GCI={};
function buildGloss(){
  const keys=Object.keys(GLOSS).sort((a,b)=>b.length-a.length); GCI={}; keys.forEach(k=>GCI[k.toLowerCase()]=k);
  GRE=new RegExp("(?<![A-Za-z0-9])("+keys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/&/g,"(?:&|&amp;)")).join("|")+")(?![A-Za-z0-9])",lang==="en"?"gi":"g");
}
buildGloss();
function gl(escaped){ const seen=new Set(); return escaped.replace(GRE,m=>{ const k=GLOSS[m]?m:GCI[m.toLowerCase().replace(/&amp;/g,"&")]; if(!k||seen.has(k)) return m; seen.add(k); return `<span class="term" tabindex="0" data-term="${esc(k)}">${m}</span>`; }); }
function rebuildAdj(){ NODES.forEach(n=>{out[n.id].length=0;inn[n.id].length=0}); EDGES.forEach(([a,b,l])=>{out[a].push({to:b,l});inn[b].push({to:a,l});}); }
const G=t=>gl(esc(t));
let sel = null, mode = "down", curView = "h";
const hvS = {level:1, domain:null};
let MAXD = 3;
document.querySelectorAll("[data-depth]").forEach(b=>b.onclick=()=>{
  MAXD=+b.dataset.depth;
  document.querySelectorAll("[data-depth]").forEach(x=>x.setAttribute("aria-pressed",x===b));
  render();
});

/* build map */
const map = document.getElementById("map"), ov = document.getElementById("ov"), detail = document.getElementById("detail");
function buildMap(){
map.querySelectorAll(".domain").forEach(x=>x.remove());
DOMAINS.forEach(d=>{
  const box = document.createElement("div");
  box.className = "domain"; box.style.setProperty("--dc", `var(${d.c})`);
  box.innerHTML = `<h3><span>${esc(d.name)}</span><span class="code">${esc(d.code)}</span></h3><p class="dd">${esc(d.desc)}</p><div class="chips"></div>`;
  const chips = box.querySelector(".chips");
  NODES.filter(n=>n.d===d.k).forEach(n=>{
    const b = document.createElement("button");
    b.type="button"; b.className="chip"; b.dataset.id=n.id; b.style.setProperty("--dc",`var(${d.c})`);
    b.textContent = n.n; b.dataset.st = tx("src");
    b.addEventListener("click",()=>select(sel===n.id?null:n.id, true));
    chips.appendChild(b);
  });
  map.appendChild(box);
});
document.getElementById("nodelist").innerHTML = NODES.map(n=>`<option value="${esc(n.n)}">`).join("");
}
buildMap();
const q = document.getElementById("q");
q.addEventListener("change",()=>{const v=q.value.trim().toLowerCase(); if(!v) return; const n=NODES.find(x=>x.n.toLowerCase()===v)||NODES.find(x=>x.n.toLowerCase().includes(v)); if(n){select(n.id,true); q.value="";}});
q.addEventListener("keydown",e=>{if(e.key==="Enter"){q.dispatchEvent(new Event("change"))}});

function setMode(m){
  mode=m; map.dataset.mode=m; detail.dataset.mode=m;
  document.getElementById("m-down").setAttribute("aria-pressed",m==="down");
  document.getElementById("m-up").setAttribute("aria-pressed",m==="up");
  renderLegend(); render();
}
document.getElementById("m-down").onclick=()=>setMode("down");
document.getElementById("m-up").onclick=()=>setMode("up");

function renderLegend(){
  const w = mode==="down"?tx("lvDown"):tx("lvUp");
  const c = mode==="down"?["--l1","--l2","--l3"]:["--up1","--up2","--up3"];
  document.getElementById("legend").innerHTML = w.map((t,i)=>`<span><i style="background:var(${c[i]})"></i>${t}</span>`).join("");
}

function bfs(start){
  const adj = mode==="down"?out:inn;
  const lvl = {[start]:0}, par = {}, order=[[],[],[],[]];
  let frontier=[start];
  for(let d=1; d<=MAXD; d++){
    const next=[];
    frontier.forEach(u=>adj[u].forEach(({to,l})=>{
      if(lvl[to]===undefined){lvl[to]=d; par[to]={from:u,l}; next.push(to); order[d].push(to);}
    }));
    frontier=next;
  }
  return {lvl,par,order};
}

function select(id, scroll){
  sel=id;
  if(id){ hvS.level=3; hvS.domain=byId[id].d; } else if(hvS.level===3){ hvS.level=2; }
  render();
  if(id && scroll && window.matchMedia("(max-width:1040px)").matches) detail.scrollIntoView({behavior:"smooth",block:"start"});
}

function render(){
  const chips = map.querySelectorAll(".chip");
  map.classList.toggle("has-sel",!!sel);
  let res=null;
  if(sel) res=bfs(sel);
  chips.forEach(c=>{
    const id=c.dataset.id; c.className="chip";
    c.querySelector(".ord")?.remove();
    if(!sel){ if(inn[id].length===0) c.classList.add("src"); return; }
    if(id===sel) c.classList.add("sel");
    else if(res.lvl[id]!==undefined) c.classList.add("lv"+res.lvl[id]);
    else c.classList.add("dim");
  });
  if(!map.hidden) drawEdges(res);
  m3.update(res);
  renderHV();
  renderDetail(res);
}

function drawEdges(res){
  const R = map.getBoundingClientRect();
  ov.setAttribute("viewBox",`0 0 ${R.width} ${R.height}`);
  if(!res){ov.innerHTML="";return;}
  let s = `<defs>${[1,2,3].map(k=>`<marker id="ar${k}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m${k}" d="M0,0 L8,4 L0,8 z"/></marker>`).join("")}</defs>`;
  const pos = id=>{const el=map.querySelector(`.chip[data-id="${id}"]`).getBoundingClientRect();return {x:el.left-R.left+el.width/2,y:el.top-R.top+el.height/2,w:el.width,h:el.height};};
  Object.entries(res.par).forEach(([child,{from}])=>{
    const k=res.lvl[child];
    let a=pos(from), b=pos(child);
    if(mode==="up"){[a,b]=[b,a];} // arrows always point in causal direction
    const clip=(p,q)=>{const dx=q.x-p.x,dy=q.y-p.y; const t=Math.min(Math.abs((p.w/2+2)/(dx||1e-6)),Math.abs((p.h/2+2)/(dy||1e-6)),1); return {x:p.x+dx*t,y:p.y+dy*t};};
    const p1=clip(a,b), p2=clip(b,a);
    const mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2, dx=p2.x-p1.x, dy=p2.y-p1.y, len=Math.hypot(dx,dy)||1;
    const bend=Math.min(60,len*0.18);
    const cx=mx-dy/len*bend, cy=my+dx/len*bend;
    s+=`<path class="e l${k}" d="M${p1.x.toFixed(1)},${p1.y.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}" marker-end="url(#ar${k})"/>`;
  });
  ov.innerHTML=s;
}

function refs(src){ return (src||[]).map(i=>`<a class="ref" href="#sources" data-src="${i}">[${i}]</a>`).join(""); }

let moreOpen=false;
function renderDetail(res){
  if(!sel && curView!=="2d" && hvS.level===2){ renderDomainPanel(hvS.domain); return; }
  if(!sel){
    detail.innerHTML = `<div class="empty"><h2>${tx("e_h")}</h2>
    <p style="color:var(--muted);margin-bottom:10px">${tx("e_p")}</p>
    <p><button class="ghost" id="gotour">${tx("e_tour")}</button></p>
    <p style="color:var(--muted);font-size:13.5px;margin-top:12px">${tx("e_or")} ${["unit_econ","landed_cost","inventory_plan"].map(id=>`<button class="ghost" data-go="${id}">${esc(byId[id].n)}</button>`).join(" ")}</p></div>`;
    detail.querySelector("#gotour").onclick=()=>{location.hash="tour";};
    detail.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>select(b.dataset.go,true));
    return;
  }
  const n=byId[sel], d=dom[n.d];
  detail.style.setProperty("--dc",`var(${d.c})`);
  const lvName = ["",...(mode==="down"?tx("lvDown"):tx("lvUp"))];
  let chain="";
  for(let k=1;k<=MAXD;k++){
    if(!res.order[k].length) continue;
    chain+=`<div class="lvl k${k}"><b>${lvName[k]} · ${res.order[k].length}</b><ul>`+res.order[k].map(id=>{
      const p=res.par[id];
      const via = mode==="down" ? `${esc(byId[p.from].n)} → ${esc(byId[id].n)}` : `${esc(byId[id].n)} → ${esc(byId[p.from].n)}`;
      return `<li><button data-go="${id}">${esc(byId[id].n)}</button> <span class="via">${via}：${esc(p.l)}</span></li>`;
    }).join("")+`</ul></div>`;
  }
  if(!chain) chain = `<p style="color:var(--muted);font-size:14px">${mode==="down"?tx("noDown"):tx("noUp")}</p>`;
  detail.innerHTML = `
   <div class="dtag">${esc(d.code)} · ${esc(d.name)}</div>
   <h2>${esc(n.n)}</h2>
   ${lang==="en"?"":`<div style="font-family:var(--mono);font-size:12px;color:var(--muted)">${esc(n.en)}</div>`}
   <h4>${tx("h_what")}</h4><p>${G(n.what)}</p>
   <h4>${tx("h_ex")}</h4><div class="exbox"><span class="badge">${tx("badge")}</span>${G(EX[n.id]||"")}</div>
   <details class="more" id="more"${moreOpen?" open":""}><summary>${tx("more")}</summary>
   <h4>${tx("h_how")}</h4><ol>${n.how.map(h=>`<li>${G(h)}</li>`).join("")}</ol>
   <h4>${tx("h_m")}</h4><div class="metrics">${n.m.map(x=>`<span>${G(x)}</span>`).join("")}</div>
   ${n.us?`<h4>${tx("h_us")}</h4><div class="us"><span class="asof">${tx("asof")} ${AS_OF}</span>${G(n.us)}${refs(n.src)}</div>`:""}
   <h4>${tx("h_data")}</h4><p class="datab">${G(n.data)}</p>
   <h4>${mode==="down"?tx("h_chainDown"):tx("h_chainUp")}</h4>
   <div class="chain">${chain}</div>
   <div class="btnrow"><button class="ghost" id="flip">${mode==="down"?tx("flipDown"):tx("flipUp")}</button></div>
   </details>
   <div class="btnrow" style="margin-top:12px"><button class="ghost" id="clr">${tx("back")}</button></div>`;
  detail.querySelector("#more").addEventListener("toggle",e=>{moreOpen=e.target.open;});
  detail.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>select(b.dataset.go,false));
  detail.querySelector("#flip").onclick=()=>setMode(mode==="down"?"up":"down");
  detail.querySelector("#clr").onclick=()=>select(null);
  detail.scrollTop=0;
}

let rt; window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{if(sel)render();},120)});
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{if(sel)render();});

/* ---------- 3D topology (layered, shares level state with the layered view) ---------- */
function domainLayers(k){
  const ids=NODES.filter(n=>n.d===k).map(n=>n.id), set=new Set(ids);
  const ie=EDGES.filter(([a,b])=>set.has(a)&&set.has(b));
  const st={}, back=new Set();
  const dfs=u=>{st[u]=1; ie.filter(e=>e[0]===u).forEach(([,v])=>{if(st[v]===1)back.add(u+">"+v); else if(!st[v])dfs(v);}); st[u]=2;};
  ids.filter(id=>!ie.some(e=>e[1]===id)).forEach(id=>{if(!st[id])dfs(id)}); ids.forEach(id=>{if(!st[id])dfs(id)});
  const L={}; const lay=id=>{if(L[id]!==undefined)return L[id]; let m=0; ie.filter(e=>e[1]===id&&!back.has(e[0]+">"+id)).forEach(([a])=>m=Math.max(m,lay(a)+1)); return L[id]=m;};
  ids.forEach(lay);
  return {ids,ie,back,L,nL:Math.max(...ids.map(i=>L[i]))+1};
}
const m3 = (function(){
  const wrap=document.getElementById("m3"), cv=wrap.querySelector("canvas"), ctx=cv.getContext("2d");
  const legend=document.getElementById("m3legend");
  let C={}, scene={nodes:[],edges:[]}, sceneKey="", NB={};
  function hexRgb(h){h=(h||"#888").trim().replace("#",""); if(h.length===3)h=h.split("").map(c=>c+c).join(""); const v=parseInt(h,16); return [(v>>16)&255,(v>>8)&255,v&255];}
  const VARS=["--fg","--muted","--surface","--bg","--ink","--up1","--l1","--line",...DOMAINS.map(d=>d.c)];
  function readColors(){const cs=getComputedStyle(document.documentElement); VARS.forEach(v=>C[v]=hexRgb(cs.getPropertyValue(v))); dirty=true;}
  const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
  const mix=(c,w,t)=>c.map((v,i)=>Math.round(v+(w[i]-v)*t));

  /* scene builders */
  function circle(n,r,i,off){const a=(n<=1?0:i/n*Math.PI*2)+(off||0); return [r*Math.cos(a), r*Math.sin(a)];}
  function buildL1(){
    const nodes=[], edges=[];
    MAIN.forEach((k,i)=>{const a=Math.PI*0.8-i/8*Math.PI*2; const n=NODES.filter(x=>x.d===k).length;
      nodes.push({id:"d:"+k,kind:"dom",key:k,label:dom[k].name,sub:`0${i+1} · ${tf("nodesN",{n})}`,col:dom[k].c,r:18,x:330*Math.cos(a),y:0,z:330*Math.sin(a)});});
    nodes.push({id:"d:D",kind:"dom",key:"D",label:dom.D.name,sub:tx("support"),col:dom.D.c,r:15,x:0,y:330,z:0});
    for(let i=0;i<MAIN.length-1;i++) edges.push({a:"d:"+MAIN[i],b:"d:"+MAIN[i+1],col:"--muted",w:2});
    edges.push({a:"d:$",b:"d:S",col:dom["$"].c,w:2,dash:true,label:tx("loop")});
    MAIN.forEach(k=>edges.push({a:"d:D",b:"d:"+k,col:"--muted",w:1,dash:true,faint:true,noArrow:true}));
    {const g=tx("lg1"); legend.innerHTML=`<span><i style="width:16px;height:0;border-radius:0;border-top:2px solid var(--muted)"></i>${g[0]}</span><span class="fb"><i></i>${g[1]}</span><span>${g[2]}</span>`;}
    return {nodes,edges,yaw:0,pitch:0.5};
  }
  function buildL2(k){

function hvL2(W,k){

  const st={}, back=new Set();
  const dfs=u=>{st[u]=1; ie.filter(e=>e[0]===u).forEach(([,v])=>{if(st[v]===1)back.add(u+">"+v); else if(!st[v])dfs(v);}); st[u]=2;};
  ids.filter(id=>!ie.some(e=>e[1]===id)).forEach(id=>{if(!st[id])dfs(id)}); ids.forEach(id=>{if(!st[id])dfs(id)});
  const L={}; const lay=id=>{if(L[id]!==undefined)return L[id]; let m=0; ie.filter(e=>e[1]===id&&!back.has(e[0]+">"+id)).forEach(([a])=>m=Math.max(m,lay(a)+1)); return L[id]=m;};

    const maxRow=Math.max(...rows.map(r=>r.length)); const nodeW=Math.min(150,(cw-(maxRow-1)*20)/maxRow);
    const nPort=Math.max(cl.inK.length,cl.outK.length);

    rows.forEach((r,l)=>{ // order by parents' x
      if(l>0) r.sort((a,b)=>{const px=id=>{const ps=ie.filter(e=>e[1]===id&&P[e[0]]).map(e=>P[e[0]].x);return ps.length?ps.reduce((x,y)=>x+y)/ps.length:mid;};return px(a)-px(b);});
      r.forEach((id,i)=>P[id]={x:mid+(i-(r.length-1)/2)*(nodeW+20),y:off+l*rowGap,w:nodeW,h:nodeH});});
    const pTop=k=>top+nodeH/2+(inner-(k-1)*52)/2;
    cl.inK.forEach((x,i)=>P["in:"+x]={x:16+portW/2,y:pTop(cl.inK.length)+i*52,w:portW,h:38});
    cl.outK.forEach((x,i)=>P["out:"+x]={x:W-16-portW/2,y:pTop(cl.outK.length)+i*52,w:portW,h:38});
  } else {

    const inRows=Math.ceil(cl.inK.length/cols), outRows=Math.ceil(cl.outK.length/cols);

  Object.entries(cl.outs).forEach(([dk,es])=>es.forEach(e=>{const a=P[e.a], b=P["out:"+dk];
    const dpath=vert?curveV(a.x,a.y+a.h/2,b.x,b.y-b.h/2-2):curveH(a.x+a.w/2,a.y,b.x-b.w/2-2,b.y);

  // internal edges
  ie.forEach(([a,b,l])=>{const A=P[a],B=P[b]; let dpath, bk=false;

  cl.inK.forEach(dk=>s+=port(dk,"in:")); cl.outK.forEach(dk=>s+=port(dk,"out:"));

  ids.forEach(id=>{const p=P[id], n=byId[id];
    s+=`<g class="n clk" data-k="${id}" data-node="${id}" tabindex="0" role="button" aria-label="${esc(n.n)}">

  s+=`</svg>`;
  hvBody.innerHTML=s;

  hvBody.querySelectorAll("g[data-port]").forEach(g=>g.addEventListener("click",()=>{hvS.domain=g.dataset.port;hvS.level=2;sel=null;render();}));

function renderTour(){
  const el=document.getElementById("v-tour"), N=TOUR.length;
  const steps=`<div class="tsteps" role="list">${TOUR.map((t,i)=>`<button type="button" role="listitem" data-ti="${i}" class="${i<tourI?"done":""}" ${i===tourI?'aria-current="step"':""}>${i+1} ${esc(t.title||dom[t.d].name)}</button>`).join("")}<button type="button" data-ti="${N}" ${tourI===N?'aria-current="step"':""}>${tx("end")}</button></div>`;
  const note=`<p class="tnote">${tx("tnote")}</p>`;
  if(tourI<N){
    const t=TOUR[tourI], d=dom[t.d];
    const ex=t.ex==="__WATERFALL__" ? `<p class="head">${tx("wfHead")}</p>${waterfall()}`+gl(tx("wfList")) : gl(t.ex);
    el.innerHTML=note+steps+`<article class="tcard" style="--dc:var(${d.c})">
      <div class="tnum">${tf("stopOf",{i:tourI+1,n:N})} · ${esc(d.code)}</div>
      <h2>${esc(t.title||d.name)}</h2>
      <p class="tone">${G(t.one)}</p>
      <div class="tex"><span class="badge">${tx("badge")}</span>${ex}</div>
      <div class="tnav">
        <div>${tourI>0?`<button type="button" class="link" id="tprev">${tx("prev")}</button>`:""} <button type="button" class="link" id="tmap">${t.node?tx("seeNode"):tx("seeDom")}</button></div>
        <button type="button" class="primary" id="tnext">${tourI===N-1?tx("toEnd"):tf("nextStop",{s:esc(TOUR[tourI+1].title||dom[TOUR[tourI+1].d].name)})} →</button>
      </div></article>`;
    el.querySelector("#tnext").onclick=()=>{tourI++;renderTour();window.scrollTo({top:0,behavior:"smooth"});};
    el.querySelector("#tprev")?.addEventListener("click",()=>{tourI--;renderTour();});
    el.querySelector("#tmap").onclick=()=>{ if(t.node){ location.hash="map"; setTimeout(()=>select(t.node,true),30); } else { hvS.level=2;hvS.domain=t.d;sel=null;location.hash="map"; } };
  } else {
    el.innerHTML=note+steps+`<article class="tcard tend" style="--dc:var(--dD)">
      ${gl(tx("endHtml"))}
      <div class="tnav"><button type="button" class="link" id="trestart">${tx("restart")}</button>
        <div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="ghost" id="tstart">${tx("byStart")}</button><button type="button" class="primary" id="tgo">${tx("goMap")}</button></div></div></article>`;
    el.querySelector("#trestart").onclick=()=>{tourI=0;renderTour();};
    el.querySelector("#tstart").onclick=()=>{location.hash="start";};
    el.querySelector("#tgo").onclick=()=>{hvS.level=1;hvS.domain=null;sel=null;location.hash="map";};
  }
  el.querySelectorAll("[data-ti]").forEach(b=>b.onclick=()=>{tourI=+b.dataset.ti;renderTour();});
}

/* glossary tooltip */
const tip=document.createElement("div"); tip.id="tip"; tip.hidden=true; tip.setAttribute("role","tooltip"); document.body.appendChild(tip);
let tipFor=null;
function showTip(el){ const k=el.dataset.term; tip.innerHTML=`<b>${esc(k)}</b>${esc(GLOSS[k]||"")}`; tip.hidden=false; tipFor=el;
  const r=el.getBoundingClientRect(), tw=tip.offsetWidth, th=tip.offsetHeight;
  let x=Math.min(Math.max(8,r.left+r.width/2-tw/2),window.innerWidth-tw-8), y=r.top-th-8; if(y<8) y=r.bottom+8;
  tip.style.left=x+"px"; tip.style.top=y+"px"; }
function hideTip(){ tip.hidden=true; tipFor=null; }
document.addEventListener("pointerover",e=>{const t=e.target.closest(".term"); if(t&&e.pointerType==="mouse") showTip(t);});
document.addEventListener("pointerout",e=>{const t=e.target.closest(".term"); if(t&&e.pointerType==="mouse") hideTip();});
document.addEventListener("focusin",e=>{const t=e.target.closest(".term"); if(t) showTip(t);});
document.addEventListener("focusout",e=>{if(e.target.closest(".term")) hideTip();});
document.addEventListener("click",e=>{const t=e.target.closest(".term"); if(t){ if(tipFor===t) hideTip(); else showTip(t); } else if(tipFor) hideTip();});
window.addEventListener("scroll",()=>{if(tipFor)hideTip();},{passive:true});

/* routing */
const views=["tour","map","start","data","us","sources"];
function route(){
  const v = views.includes(location.hash.slice(1))?location.hash.slice(1):"tour";
  if(v==="tour") renderTour();
  views.forEach(x=>document.getElementById("v-"+x).hidden = x!==v);
  document.querySelectorAll("nav.tabs a").forEach(a=>{ if(a.dataset.v===v) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  if(v==="map") requestAnimationFrame(render);
}
window.addEventListener("hashchange",route);

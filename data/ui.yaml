wfAria:
  en: "Unit profit breakdown: a $19.99 price leaves $4.82 after all costs"
  zh: 单件利润拆解：售价 19.99 美元，扣除各项成本后剩 4.82 美元
wfHead:
  en: "Here's where the money from each $19.99 sale goes:"
  zh: 每卖一件 $19.99，钱是这样被分掉的：
wfList:
  en: "<ul><li>300 units a month × $4.82 ≈ <b>$1,446</b> (before staff, software and other fixed costs).</li><li>But the first order needs about <b>$5,270</b> up front, sales start about 70 days later, and with launch ad spend it often takes several months to earn it back.</li><li>So watch two sets of books: the P&L tells you whether you make money; cash flow tells you whether you can keep going.</li></ul>"
  zh: <ul><li>每月 300 件 × $4.82 ≈ <b>$1,446</b>（还没扣人工、软件等固定开支）。</li><li>但首批货要先付出约 <b>$5,270</b>，大约 70 天后才开始卖，再加上新品期广告投入，往往要几个月才能收回。</li><li>所以要同时看两本账：利润表看赚不赚钱，现金流看钱够不够周转。</li></ul>
end:

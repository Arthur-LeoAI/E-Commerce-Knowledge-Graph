tnote:
  en: Follow a fictional product, a collapsible silicone cup, from deciding what to sell through all 8 steps of e-commerce. Every price, score, fee and tax rate is an <b>illustrative number</b> made up for teaching, not a real rate or market figure. Hover over a dotted-underlined term (tap on a phone) for a quick explanation.
  zh: 跟着一个虚构的小产品“折叠硅胶水杯”，从“卖什么”开始，一站一站走完电商的 8 个环节。所有价格、分数、费用和税率都是为讲解编的<b>示例数字</b>，不代表真实费率或市场数据。把鼠标放在带虚线的词上（手机上点一下）可以看解释。

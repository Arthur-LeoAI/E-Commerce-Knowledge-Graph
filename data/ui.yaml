h1:
  en: E-commerce Operations Atlas
  zh: 电商运营全景图谱
sub:
  en: Everything it takes to run an online store, split into 9 areas and 48 points, with how they affect each other. New here? Take the beginner tour first; once you're familiar, drill down level by level in the map.
  zh: 把做电商需要的事情拆成 9 个领域、48 个节点，并标出它们之间的影响关系。第一次来，先走一遍“新手导览”；熟悉以后，到“全景图谱”里逐层展开。
formula:
  en: <b>Profit</b> = units × unit profit ｜ <b>Units</b> = traffic × conversion rate ｜ <b>Unit profit</b> = price − landed cost − platform fees − ad cost per unit − return losses
  zh: <b>利润</b> = 销量 × 单件利润 ｜ <b>销量</b> = 流量 × 转化率 ｜ <b>单件利润</b> = 售价 − 落地成本 − 平台费用 − 单件广告费 − 退货损失

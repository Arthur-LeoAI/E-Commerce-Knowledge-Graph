endHtml:
  en: |-
    <div class="tnum">Finish</div><h2>You've made it through once</h2>
          <p class="tone">Remember these three things and you have the core of e-commerce:</p>
          <ol><li><b>Profit = units × unit profit.</b> Unit profit must take out landed cost, platform fees, ads and returns.</li>
          <li><b>Every step pulls on the others.</b> A slightly bigger box raises fulfilment fees; a few days out of stock drops rank and traffic.</li>
          <li><b>Making a profit isn't the same as having cash.</b> You pay suppliers first and get paid later; when cash runs out, the business stops.</li></ol>
          <p style="color:var(--muted);font-size:14px">One area wasn't covered: Data & Team. It supports every step; look at it once you're comfortable.</p>
  zh: |-
    <div class="tnum">终点</div><h2>你已经走完了一遍</h2>
          <p class="tone">记住这三件事，就抓住了电商的主线：</p>
          <ol><li><b>利润 = 销量 × 单件利润。</b>单件利润要把落地成本、平台费用、广告和退货都扣干净。</li>
          <li><b>每个环节都会牵动别的环节。</b>包装大一点，配送费就高；断货几天，排名和流量都会掉。</li>
          <li><b>赚钱不等于有钱。</b>货款要先付，回款要等，现金流断了生意就停了。</li></ol>
          <p style="color:var(--muted);font-size:14px">还有一个环节没讲：“数据与组织”。它支撑所有环节，等你熟悉以后再看。</p>

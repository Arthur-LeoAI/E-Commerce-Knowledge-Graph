tl_note:
  en: Time is always a range. Enter the shortest, typical and longest days for each phase; the total is shown as a range. Leave blank to skip.
  zh: 时间永远是一个区间。请为每个阶段填写最短、一般、最长天数，总时间会以区间显示。不填则不计算。
tl_low:
  en: Shortest
  zh: 最短
tl_typ:
  en: Typical
  zh: 一般
tl_high:
  en: Longest
  zh: 最长
tl_production:
  en: Production
  zh: 生产
tl_transit:
  en: Transit
  zh: 运输
tl_receiving:
  en: Receiving at the warehouse
  zh: 入仓
tl_total:
  en: "Total: {a} to {c} days, typically {b}"
  zh: 合计：{a} 到 {c} 天，一般 {b} 天
tl_mc:
  en: "Simulation of {n} runs: half finish within {p50} days, 9 in 10 within {p90} days."
  zh: 模拟 {n} 次：一半在 {p50} 天内完成，十次中有九次在 {p90} 天内完成。
tl_empty:
  en: Fill in all three numbers for at least one phase to see the range.
  zh: 至少为一个阶段填满三个数字，才会显示区间。
tl_bad:
  en: "For each phase: shortest ≤ typical ≤ longest."
  zh: 每个阶段都需要：最短 ≤ 一般 ≤ 最长。
calc_rules_h:
  en: Look up the real numbers
  zh: 查询真实数字

start_intro:
  en: |-
    <h2>Starting an online business from zero</h2>
    <p class="lead">Eight stages in order. Each lists what you should have at the end, the most common mistake, and the matching points on the map. Click a point to open it on the map.</p>
  zh: |-
    <h2>从零开始做电商</h2>
    <p class="lead">按顺序排列的八个阶段。每个阶段列出要产出什么、最容易出什么问题，以及对应图谱里的哪些节点。点节点可以跳到图谱查看详情。</p>
data_page:
  en: |-
    <h2>From knowledge map to working tool</h2>
    <p class="lead">This map is the first layer: what the work is and how it connects. To become a tool you can make decisions with, it needs real data, and calculation methods used according to how reliable they are.</p>
    <h3>Four layers</h3>
    <div class="tbl"><table><thead><tr><th>Layer</th><th>Question it answers</th><th>Status now</th></tr></thead><tbody>
    <tr><td>Knowledge</td><td>What the work is and how it connects</td><td>First version done (this page)</td></tr>
    <tr><td>Metrics</td><td>Which metrics measure each point, and how they're defined</td><td>Key metrics listed per point; definitions need to match your company</td></tr>
    <tr><td>Data</td><td>Where each metric's real numbers come from</td><td>Not connected yet; see the data sources table below</td></tr>
    <tr><td>Analysis</td><td>What happened, why, and what comes next</td><td>Built step by step in the four stages below</td></tr>
    </tbody></table></div>
    <h3>Four stages of analysis</h3>
    <div class="stage">
    <div><span class="k">Stage 1 · exact</span><h4>Reporting & accounting</h4><p>Sales dashboards, unit profit, landed cost, days of inventory. All exact calculations: correct data gives correct results.</p></div>
    <div><span class="k">Stage 2 · exact</span><h4>Driver breakdown</h4><p>Split profit changes into units and unit profit, and units into traffic and conversion. Identities show which step the problem is in.</p></div>
    <div><span class="k">Stage 3 · has error, must be validated</span><h4>Statistics & forecasting</h4><p>Demand forecasts, price elasticity, ad effectiveness. Must be backtested on history and reported with an error range before use.</p></div>
    <div><span class="k">Stage 4 · has error, must be validated</span><h4>Decision optimisation</h4><p>Optimal reorder quantities, ad budget allocation. Built on models already validated in stage 3.</p></div>
    </div>
    <h3>Data sources</h3>
    <div class="tbl"><table><thead><tr><th>Data</th><th>Source</th><th>Points it supports</th></tr></thead><tbody>
    <tr><td>Orders, inventory, fees, settlements</td><td>Amazon Selling Partner API reports</td><td>Sales, inventory planning, platform fees, P&L</td></tr>
    <tr><td>Advertising</td><td>Amazon Ads API</td><td>On-platform ads, traffic</td></tr>
    <tr><td>Traffic & conversion</td><td>Business reports, Brand Analytics, GA4</td><td>Traffic, conversion rate, keywords</td></tr>
    <tr><td>Own website</td><td>Shopify and similar platform APIs</td><td>Own website, sales, repeat purchases</td></tr>
    <tr><td>Purchasing & inventory</td><td>ERP</td><td>Purchasing, landed cost, replenishment</td></tr>
    <tr><td>Freight & customs</td><td>Forwarder invoices, entry summaries</td><td>First-mile, tariffs, landed cost</td></tr>
    <tr><td>Finance</td><td>Accounting software, bank statements</td><td>P&L, cash flow, exchange rate</td></tr>
    <tr><td>Competitors & market</td><td>Third-party tools (e.g. Keepa)</td><td>Competitors, market research, price</td></tr>
    </tbody></table></div>
    <h3>Principles</h3>
    <ul>
    <li>Standardise SKU codes and metric definitions before any analysis.</li>
    <li>Every number can be traced back to a source report.</li>
    <li>If an identity can calculate it, don't estimate it with a model.</li>
    <li>Statistical results like forecasts and elasticities always come with backtested error; estimates are never treated as facts.</li>
    <li>Use aggregated data only; keep customers' personal information out of the analysis system.</li>
    </ul>
  zh: |-
    <h2>从知识体系到可用工具</h2>
    <p class="lead">这张图谱是第一层：搞清楚有哪些事、彼此怎么影响。要变成能用来做决策的工具，需要接入真实数据，并且按可信程度分层使用计算方法。</p>
    <h3>四层结构</h3>
    <div class="tbl"><table><thead><tr><th>层</th><th>回答的问题</th><th>现在的状态</th></tr></thead><tbody>
    <tr><td>知识层</td><td>有哪些事情，彼此什么关系</td><td>本页面已完成第一版</td></tr>
    <tr><td>指标层</td><td>每个节点用哪些指标衡量，口径是什么</td><td>每个节点已列出关键指标，口径需要按公司实际定义</td></tr>
    <tr><td>数据层</td><td>每个指标的真实数值从哪里来</td><td>待接入，见下方数据来源表</td></tr>
    <tr><td>分析层</td><td>发生了什么、为什么、接下来会怎样</td><td>按下方四个阶段逐步建设</td></tr>
    </tbody></table></div>
    <h3>分析能力的四个阶段</h3>
    <div class="stage">
    <div><span class="k">阶段 1 · 可以算准</span><h4>描述与核算</h4><p>销售看板、单件利润、落地成本、库存天数。都是确定性计算，数据对了结果就对。</p></div>
    <div><span class="k">阶段 2 · 可以算准</span><h4>驱动拆解</h4><p>利润变化拆到销量和单件利润，销量拆到流量和转化。用恒等式定位问题出在哪个环节。</p></div>
    <div><span class="k">阶段 3 · 有误差，需验证</span><h4>统计与预测</h4><p>需求预测、价格弹性、广告效果。必须用历史数据回测，报告误差范围，再用于决策。</p></div>
    <div><span class="k">阶段 4 · 有误差，需验证</span><h4>决策优化</h4><p>补货量优化、广告预算分配。建立在阶段 3 已验证的模型之上。</p></div>
    </div>
    <h3>数据来源</h3>
    <div class="tbl"><table><thead><tr><th>数据</th><th>来源</th><th>支撑的节点</th></tr></thead><tbody>
    <tr><td>订单、库存、费用、结算</td><td>Amazon Selling Partner API 报表</td><td>销量、库存计划、平台费用、利润表</td></tr>
    <tr><td>广告</td><td>Amazon Ads API</td><td>站内广告、流量</td></tr>
    <tr><td>流量与转化</td><td>业务报告、Brand Analytics、GA4</td><td>流量、转化率、关键词</td></tr>
    <tr><td>独立站</td><td>Shopify 等平台 API</td><td>独立站、销量、复购</td></tr>
    <tr><td>采购与库存</td><td>ERP</td><td>采购、落地成本、补货</td></tr>
    <tr><td>物流与清关</td><td>货代账单、报关单（Entry Summary）</td><td>头程、关税、落地成本</td></tr>
    <tr><td>财务</td><td>财务软件、银行流水</td><td>利润表、现金流、汇率</td></tr>
    <tr><td>竞品与市场</td><td>第三方工具（如 Keepa）</td><td>竞争对手、市场调研、售价</td></tr>
    </tbody></table></div>
    <h3>建设原则</h3>
    <ul>
    <li>先统一 SKU 编码和指标口径，再做任何分析。</li>
    <li>每个数字都能追溯到来源报表。</li>
    <li>能用恒等式算的，不用模型去估。</li>
    <li>预测和弹性这类统计结果，必须附带回测误差，不把估计值当成事实。</li>
    <li>只使用汇总数据，不把客户个人信息放进分析系统。</li>
    </ul>
not_advice:
  en: This page is for learning and organising work. It is not legal, tax or financial advice.
  zh: 本页面用于学习和梳理工作，不构成法律、税务或财务建议。
rules_intro:
  en: <h2>Market rules</h2><p class="lead">What you must follow is the laws of the country you sell into plus the rules of the marketplace you sell on. Pick where you sell; the page shows only that combination. Every rule lists its sources, when it was checked and when it is due for review. Rules change, so check the sources before you act.</p>
  zh: <h2>市场规则</h2><p class="lead">卖家需要遵守的，是销售目的国的法律，加上所在平台这个站点的规则。先选择你在哪里销售，页面只显示适用于这个组合的规则。每条规则都列出来源、核对日期和下次复查日期。规则会变化，行动前请先查看来源。</p>
sources_intro:
  en: <h2>Sources</h2><p class="lead">Every source cited by the market rules, with the rules that cite it. Official government and platform pages come first. Everything else on this site is general e-commerce practice and the fictional running example.</p>
  zh: <h2>来源</h2><p class="lead">市场规则引用的全部来源，以及引用它们的规则。优先使用政府和平台的官方页面。网站上的其他内容是电商运营的通用方法和虚构的示例。</p>
calc_intro:
  en: <h2>Calculator</h2><p class="lead">Work out the numbers for your own product. Every box starts with the running example (a fictional collapsible silicone cup); replace the numbers with your own. Each result shows how it was worked out. Look up real duty rates and Amazon fees through the linked rules.</p>
  zh: <h2>计算器</h2><p class="lead">用你自己的产品来算账。每个输入框默认填的是贯穿全站的示例（一款虚构的折叠硅胶水杯），请换成你自己的数字。每个结果都列出计算过程。真实的关税税率和亚马逊费用，请通过下方关联的规则查询。</p>
